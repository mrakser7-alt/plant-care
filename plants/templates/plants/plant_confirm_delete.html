{% extends 'base.html' %}

{% block title %}Удалить {{ plant.name }} · Plant Care{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <div class="display-3 mb-3">🗑</div>
                <h1 class="h4">Удалить «{{ plant.name }}»?</h1>
                <p class="text-muted">Действие нельзя отменить.</p>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'plant_detail' plant.pk %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
